<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hall Bookings — Overview</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div></div>

<div id="loginScreen" class="login-screen">
  <form id="loginForm" class="login-card">
    <h1>Hall Bookings</h1>
    <p class="login-sub">Read-only overview — sign in to view</p>
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">Sign in</button>
    <p id="loginError" class="error-text"></p>
  </form>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <h1>Hall Bookings — Overview</h1>
    <button id="logoutBtn" class="logout-btn">Sign out</button>
  </header>
  <main>
    <p class="hint">Read-only — no editing available on this page.</p>
    <div class="legend">
      <span class="legend-item"><i class="dot pending"></i>Pending</span>
      <span class="legend-item"><i class="dot accepted"></i>Accepted</span>
      <span class="legend-item"><i class="dot block"></i>Setup / Teardown / Internal</span>
      <span class="legend-item"><i class="paybadge pending-pay"></i>Payment pending</span>
      <span class="legend-item"><i class="paybadge partial-pay"></i>Partially paid</span>
      <span class="legend-item"><i class="paybadge paid-pay">$</i>Paid</span>
    </div>
    <div id="calendar"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
